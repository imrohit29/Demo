<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShipGlobal.in - Dashboard</title>
<link rel="stylesheet" href="common/css/layout.css">
<link rel="stylesheet" href="common/css/sidebar.css">
<link rel="stylesheet" href="common/css/header.css">
<link rel="stylesheet" href="common/css/cards.css">
<link rel="stylesheet" href="common/css/dark-mode.css">
<link rel="stylesheet" href="common/css/customer-pages.css">
<link rel="stylesheet" href="modules/customers/vendors/vendors.css">
<link rel="stylesheet" href="common/css/cti-demo.css">
<link rel="stylesheet" href="common/css/rating-page.css">
<script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
<div class="app">
<aside class="sidebar" id="sidebar"><div id="sidebar-content"></div></aside>
<main class="main-area">
<header class="top-header"><div id="header-content"></div></header>
<section class="dashboard">
<div class="access-section">
<div class="access-label">YOUR ACCESS</div>
<h1>Your workspace, your way.</h1>
<p>You have access to the modules below — jump right in.</p>
</div>
<div class="module-grid">
<div class="module-card"><i data-lucide="archive"></i><span>Operations</span></div>
<div class="module-card"><i data-lucide="list"></i><span>Orders</span></div>
<div class="module-card"><i data-lucide="user-round-check"></i><span>Customers</span></div>
<div class="module-card"><i data-lucide="shopping-bag"></i><span>Wallet</span></div>
<div class="module-card"><i data-lucide="file-text"></i><span>Manifest</span></div>
<div class="module-card"><i data-lucide="map-pin"></i><span>Pickup</span></div>
<div class="module-card"><i data-lucide="layers"></i><span>Modules</span></div>
<div class="module-card"><i data-lucide="handshake"></i><span>KAM &amp; Sales</span></div>
<div class="module-card active-tracking"><i data-lucide="globe"></i><span>Tracking</span></div>
<div class="module-card"><i data-lucide="scroll-text"></i><span>Tech</span></div>
<div class="module-card"><i data-lucide="bar-chart-3"></i><span>Reports</span></div>
<div class="module-card"><i data-lucide="users-round"></i><span>Settings</span></div>
</div>
</section>
</main>
</div>
<script src="common/js/sidebar.js"></script>
<script src="common/js/header.js"></script>
<script src="common/js/dark-mode.js"></script>
<script src="common/js/customer-pages.js"></script>
<script src="common/js/rating-page.js"></script>
<script src="modules/customers/vendors/vendors.js"></script>
<script src="common/js/profile.js"></script>
<script src="common/js/cti-demo.js"></script>
<script>lucide.createIcons();</script>
</body>
</html>
